name: Bump auto-merge

# Workflowified upstream `brew pr-automerge`: merge bot version-bump PRs once
# their checks are green, so no maintainer ever has to click merge.
# Never checks out or executes PR code; every decision comes from the API.
#
# A PR is merged only when ALL of these hold (fail-closed: anything unexpected
# leaves the PR open for a human):
# - open, not a draft, targeting main, from a same-repo bump-* or sync/* branch
# - authored by github-actions[bot] (pre-PAT bumps) or the repo owner (PAT bumps)
# - bump-*: exactly one modified file under Casks/
#   sync/*: every file an added file under Casks/ (pure import, no edits)
# - no blocklist label (automerge-skip, do not merge)
# - every check run on the head SHA is completed, none ended in a real bad
#   outcome (failure, startup_failure, cancelled, timed_out, action_required,
#   error), and the signals this repo enforces - the CI conclusion job, audit,
#   Workflow lint and CodeQL - are present on that exact head and actually
#   success. neutral/skipped results are tolerated only as advisory context
#   (CodeRabbit, Dependabot auto-merge), never for those four signals.
# - GitHub reports the PR mergeable
# - the head SHA still matches at merge time (--match-head-commit)
#
# Deliberately NOT `gh pr merge --auto`: with no required-checks ruleset,
# --auto would merge immediately without waiting for CI. The checks above are
# evaluated explicitly instead.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge green bump PRs
        run: |
          set -euo pipefail

          REPO="${REPO:?}"
          OWNER="${REPO%%/*}"

          # Interpolated (not --arg): the preinstalled gh on runners predates
          # --arg support for --jq. Values are runner-controlled identifiers
          # (owner/repo login charset), never PR-controlled strings.
          filter="[.[] | select(.isDraft | not)
                   | select(.baseRefName == \"main\")
                   | select(.headRefName | startswith(\"bump-\") or startswith(\"sync/\"))
                   | select(.headRepository.nameWithOwner == \"$REPO\")
                   | select(.author.login == \"github-actions[bot]\" or .author.login == \"$OWNER\")
             ]"
          if ! candidates="$(gh pr list --repo "$REPO" --state open --limit 50 \
              --json number,headRefName,headRefOid,headRepository,baseRefName,author,isDraft \
              --jq "$filter")"; then
            echo "Could not read candidate PRs; merging nothing."
            exit 1
          fi
          if ! jq -e 'type == "array"' <<<"$candidates" >/dev/null; then
            echo "Candidate PR payload is not an array; merging nothing."
            exit 1
          fi

          count="$(jq 'length' <<<"$candidates")"
          if [[ "$count" -eq 0 ]]; then
            echo "No candidate bump PRs."
            exit 0
          fi

          merged=0
          while read -r number; do
            sha="$(jq -r --argjson n "$number" '.[] | select(.number == $n) | .headRefOid' <<<"$candidates")"
            branch="$(jq -r --argjson n "$number" '.[] | select(.number == $n) | .headRefName' <<<"$candidates")"
            echo "=== #$number ($branch @ ${sha:0:7}) ==="

            skip() { echo "skip #$number: $1"; }

            mergeable=""
            for attempt in {1..5}; do
              if ! mergeable="$(gh pr view "$number" --repo "$REPO" --json mergeable --jq .mergeable)"; then
                mergeable=""
                break
              fi
              [[ "$mergeable" == "UNKNOWN" ]] || break
              if [[ "$attempt" -lt 5 ]]; then sleep 2; fi
            done
            if [[ "$mergeable" != "MERGEABLE" ]]; then
              skip "not mergeable right now"; continue
            fi

            # `gh api`/`gh pr view` --jq takes exactly one argument, so it has no
            # `-e` mode; the predicate is evaluated as an expression instead.
            # An unreadable or unexpected label payload is not "no blocklist".
            if ! labels="$(gh pr view "$number" --repo "$REPO" --json labels \
                --jq '[.labels[].name]')"; then
              skip "could not read labels"; continue
            fi
            if ! jq -e 'type == "array" and all(type == "string")' <<<"$labels" >/dev/null; then
              skip "label payload malformed"; continue
            fi
            if jq -e 'map(select(. == "automerge-skip" or . == "do not merge")) | length > 0' \
                <<<"$labels" >/dev/null; then
              skip "blocklist label present"; continue
            fi

            files_gate='length == 1 and .[0].status == "modified" and (.[0].filename | test("^Casks/[^/]+\\.rb$"))'
            files_desc="exactly one modified Casks/*.rb"
            if [[ "$branch" == sync/* ]]; then
              # Import PRs add new casks; any modification or non-cask file
              # means a human touched it and must review it.
              files_gate='length > 0 and all(.status == "added" and (.filename | test("^Casks/[^/]+\\.rb$")))'
              files_desc="only added Casks/*.rb files"
            fi
            # The whole diff is judged at once: --paginate emits one array per
            # page, so slurp and concatenate before applying the gate. A failed
            # or empty read must never look like a clean single-file diff.
            if ! files="$(gh api "repos/$REPO/pulls/$number/files" --paginate | jq -s 'add')"; then
              skip "could not read PR files"; continue
            fi
            if ! jq -e 'type == "array" and length > 0' <<<"$files" >/dev/null; then
              skip "PR file list empty or malformed"; continue
            fi
            if ! jq -e "$files_gate" <<<"$files" >/dev/null; then
              skip "diff is not $files_desc"; continue
            fi

            # filter=latest: a context that failed on an earlier run but has
            # since succeeded on this same head counts once, by its latest
            # result. An unreadable payload is not an empty (passing) one.
            # Every page is read and merged before any judgement: a failure
            # hiding behind page 1 must not be invisible to the gates.
            if ! checks="$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100&filter=latest" \
                --paginate \
                | jq -s 'map(.check_runs)
                         | if any(.[]; type != "array") then error("malformed check-runs page")
                           else (add // []) | map({name, status, conclusion})
                           end')"; then
              skip "could not read check runs"; continue
            fi
            if ! jq -e 'type == "array" and length > 0 and all(type == "object")' <<<"$checks" >/dev/null; then
              skip "check-run payload empty or malformed"; continue
            fi
            # Nothing may still be running, and no context may end in a real bad
            # outcome anywhere. neutral/skipped are advisory bots (CodeRabbit,
            # Dependabot auto-merge) and are tolerated only as such.
            if ! jq -e 'all(.status == "completed")' <<<"$checks" >/dev/null; then
              skip "a check run is not completed"; continue
            fi
            if ! jq -e 'all(.conclusion != "failure"
                            and .conclusion != "startup_failure"
                            and .conclusion != "cancelled"
                            and .conclusion != "timed_out"
                            and .conclusion != "action_required"
                            and .conclusion != "error")' <<<"$checks" >/dev/null; then
              skip "a check run failed, was cancelled or needs action"; continue
            fi
            # The signals this repo actually enforces must be present on this
            # exact head AND actually green; neutral/skipped is not a pass here.
            if ! jq -e '[.[] | select(.conclusion == "success") | .name] as $ok
                        | ($ok | index("conclusion")) != null
                          and ($ok | index("audit")) != null
                          and ($ok | index("Workflow lint")) != null
                          and ([$ok[] | select(startswith("CodeQL"))] | length > 0)' \
                <<<"$checks" >/dev/null; then
              skip "CI conclusion, audit, Workflow lint or CodeQL not green on this head"; continue
            fi

            echo "merge #$number: all gates green"
            # CAS: the head must still be exactly the SHA every gate above was
            # evaluated against.
            if ! gh pr merge --repo "$REPO" --squash --delete-branch \
                --match-head-commit "$sha" "$number"; then
              skip "merge rejected (head moved or not permitted)"; continue
            fi
            merged=$((merged + 1))
          done < <(jq -r '.[].number' <<<"$candidates")

          echo "Merged $merged PR(s)."

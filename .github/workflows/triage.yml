name: Triage

# Metadata-only label action needs PR write; no checkout or PR code execution.
on: pull_request_target # zizmor: ignore[dangerous-triggers]

concurrency:
  group: "triage-${{ github.event.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label pull request
        uses: Homebrew/actions/label-pull-requests@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          def: |
            - label: unsigned
              path: Casks/.+
              content: com\.apple\.quarantine\n
            - label: cask disabled
              path: Casks/.+
              content: \n  disable!.*\n
            - label: new cask
              status: added
              path: Casks/.+
              allow_any_match: true
            - label: documentation
              path: (.*\.md|\.github/.*)
            - label: bump-cask-pr
              pr_body_content: Created with `brew bump-cask-pr`
            - label: ci
              path: \.github/workflows/.*\.yml

name: sync-disabled-casks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clone homebrew/cask
        run: git clone --depth 1 https://github.com/Homebrew/homebrew-cask.git /tmp/homebrew-cask
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Sync
        run: |
          SRC_CASK_DIR=/tmp/homebrew-cask/Casks python3 scripts/sync_disabled_casks.py
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="sync/$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add Casks/
          git commit -m "sync: update $(ls Casks | wc -l) disabled casks from Homebrew/homebrew-cask"
          git push origin "$branch"
          gh pr create --title "sync: update disabled casks $(date +%Y-%m-%d)" --body "Automated sync from Homebrew/homebrew-cask (fails_gatekeeper_check). Strips disable! and injects quarantine removal. Audit with \`brew audit --cask --strict\`." --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

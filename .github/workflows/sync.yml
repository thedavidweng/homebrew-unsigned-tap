name: Radar livecheck fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
      - name: Tap self
        run: brew tap --custom-remote thedavidweng/unsigned-tap "${GITHUB_WORKSPACE}"
      - name: Trust tap
        run: brew trust thedavidweng/unsigned-tap
      - name: Verify TreeSheets livecheck conflict
        env:
          TAP_CASK_DIR: ${{ github.workspace }}/Casks
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import radar

          confirmed, conflicts, unresolved = radar.classify_catchups([("treesheets", "3333")])
          print("confirmed:", confirmed)
          print("conflicts:", conflicts)
          print("unresolved:", unresolved)
          assert not confirmed and not unresolved
          assert len(conflicts) == 1 and conflicts[0][0:2] == ("treesheets", "3333")
          assert "arm: 2.23.1 → 2.23.1 (current)" in conflicts[0][2]
          assert "intel: 2.23.1 → 2.23.1 (current)" in conflicts[0][2]
          PY

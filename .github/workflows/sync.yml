name: sync-disabled-casks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clone homebrew/cask
        run: git clone --depth 1 https://github.com/Homebrew/homebrew-cask.git /tmp/homebrew-cask
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c722b5d961eb7f3ebec81ec2e5584faf7c3cff5d # main
        with:
          core: false
          cask: false
          # setup-homebrew 会把 checkout 移走并换成全新 git init 的 tap 仓库
          # （rm -rf GITHUB_WORKSPACE/*），连 checkout 写入的 credential 一起清掉；
          # 传 token 让它写入全局 extraheader，否则后续 git push 无认证可用。
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync
        run: |
          SRC_CASK_DIR=/tmp/homebrew-cask/Casks python3 scripts/sync_disabled_casks.py
          # Normalize with brew's own fixer (new DSL migrations, grouping).
          # Keeps `brew style --tap` green even when upstream still uses old syntax.
          brew style --fix Casks/ || true
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="sync/$(date +%Y%m%d)"
          git checkout -B "$branch"
          git add Casks/
          git commit -m "sync: update $(find Casks -maxdepth 1 -name '*.rb' | wc -l | tr -d ' ') disabled casks from Homebrew/homebrew-cask"
          # setup-homebrew 的 tap 搬迁会清掉 checkout 存的 credential，
          # push 前用 GITHUB_TOKEN 重写 origin，保证认证一定存在。
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "$branch"
          # Requires repo setting: Settings > Actions > General >
          # "Allow GitHub Actions to create and approve pull requests".
          # If disabled, the branch is still pushed; create the PR manually.
          # Do not fail the check for a repo setting.
          if gh pr create --title "sync: update disabled casks $(date +%Y-%m-%d)" --body "Automated sync from Homebrew/homebrew-cask (fails_gatekeeper_check). Strips disable! and injects quarantine removal. Audit with \`brew audit --cask --strict\`." --base main; then
            echo "Opened sync PR."
          else
            echo "::warning::gh pr create failed. If the error is 'GitHub Actions is not permitted to create or approve pull requests', enable it in Settings > Actions > General, then create the PR manually from branch $branch."
            if gh pr list --head "$branch" --json number --jq '.[0].number' 2>/dev/null | grep -q '[0-9]'; then
              echo "A PR for $branch already exists."
            fi
            exit 0
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

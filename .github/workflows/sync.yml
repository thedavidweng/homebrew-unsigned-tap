name: sync-disabled-casks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone Homebrew casks
        run: git clone --depth 1 https://github.com/Homebrew/homebrew-cask.git /tmp/homebrew-cask
      - name: Snapshot upstream versions
        env:
          SRC_CASK_DIR: /tmp/homebrew-cask/Casks
          SNAPSHOT_OUT: upstream-versions.json
        run: python3 scripts/upstream_snapshot.py
      - name: Retain upstream snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-versions-v2
          path: upstream-versions.json
          retention-days: 7

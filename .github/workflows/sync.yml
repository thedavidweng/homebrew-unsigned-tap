name: Mechvibes legacy smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
      - name: Trust tap
        run: |
          brew tap --custom-remote thedavidweng/unsigned-tap "$GITHUB_WORKSPACE"
          brew trust thedavidweng/unsigned-tap
      - name: Check upstream release
        run: |
          set -euo pipefail
          brew livecheck --cask --json thedavidweng/unsigned-tap/mechvibes |
            jq -e 'length == 1 and .[0].version.current == "2.3.4" and (.[0].version.latest | type == "string")'
      - name: Install and launch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Applications"
          brew install --cask thedavidweng/unsigned-tap/mechvibes --appdir="$RUNNER_TEMP/Applications"
          app="$RUNNER_TEMP/Applications/Mechvibes.app"
          test "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = 2.3.4
          open -n "$app"
          for ((attempt = 0; attempt < 30; attempt++)); do
            if pid="$(pgrep -f "$app/Contents/MacOS/Mechvibes" | head -n 1)" && [[ -n "$pid" ]]; then
              sleep 5
              kill -0 "$pid"
              kill "$pid"
              brew uninstall --cask thedavidweng/unsigned-tap/mechvibes
              exit 0
            fi
            sleep 1
          done
          echo 'Mechvibes did not remain running' >&2
          exit 1
      - name: Online audit
        run: brew audit --cask --online thedavidweng/unsigned-tap/mechvibes

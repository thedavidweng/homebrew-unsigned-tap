name: Brewtarget platform smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            version: 5.1.1
            arch: arm
          - runner: macos-26
            version: 5.2.0
            arch: arm
          - runner: macos-15-intel
            version: 5.1.1
            arch: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
      EXPECTED_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
      - name: Trust tap
        run: |
          brew tap --custom-remote thedavidweng/unsigned-tap "$GITHUB_WORKSPACE"
          brew trust thedavidweng/unsigned-tap
      - name: Install and launch
        if: matrix.arch == 'arm'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Applications"
          brew install --cask thedavidweng/unsigned-tap/brewtarget --appdir="$RUNNER_TEMP/Applications"
          app="$RUNNER_TEMP/Applications/brewtarget_${EXPECTED_VERSION}_MacOS.app"
          test -x "$app/Contents/MacOS/Brewtarget"
          "$app/Contents/MacOS/Brewtarget" > "$RUNNER_TEMP/brewtarget.log" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid"; then
            cat "$RUNNER_TEMP/brewtarget.log"
            exit 1
          fi
          kill "$pid"
          brew audit --cask --online thedavidweng/unsigned-tap/brewtarget
          brew uninstall --cask thedavidweng/unsigned-tap/brewtarget
          test ! -e "$app"
      - name: Reject unsupported Intel installation
        if: matrix.arch == 'intel'
        run: |
          set -euo pipefail
          if brew install --cask thedavidweng/unsigned-tap/brewtarget > "$RUNNER_TEMP/install.log" 2>&1; then
            echo 'Unexpected Intel installation' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/install.log"
          grep -F 'depends on hardware architecture' "$RUNNER_TEMP/install.log"

name: Isolated scheduled radar fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check production script identity
        run: |
          set -euo pipefail
          for file in scripts/radar.py scripts/upstream_catchup.py scripts/check_cask_health.py; do
            test "$(git hash-object "$file")" = "$(git rev-parse "9032322b243eff7ee75517e555c7a1ff497a8e2c:$file")"
          done
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
      - name: Tap self
        run: brew tap --custom-remote thedavidweng/unsigned-tap "${GITHUB_WORKSPACE}"
      - name: Trust tap
        run: brew trust thedavidweng/unsigned-tap
      - name: Check download availability
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          python3 scripts/check_cask_health.py --json-out dead.json || true
          test -s dead.json
      - name: Fetch upstream version snapshot
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream-snapshot
          aid="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=upstream-versions-v2&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)] | .[0].id // empty')"
          test -n "$aid"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" > /tmp/upstream-snapshot.zip
          unzip -o -q /tmp/upstream-snapshot.zip -d /tmp/upstream-snapshot
          test -s /tmp/upstream-snapshot/upstream-versions.json
      - name: Update and close isolated radar issue
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          PYTHONDONTWRITEBYTECODE: 1
          TAP_CASK_DIR: ${{ github.workspace }}/Casks
          SNAPSHOT_JSON: /tmp/upstream-snapshot/upstream-versions.json
          DEAD_JSON: dead.json
        run: python3 tests/radar_scheduled_fixture.py

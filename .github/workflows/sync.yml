name: OBS plugin smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
      - name: Install OBS and plugin
        run: |
          brew tap --custom-remote thedavidweng/unsigned-tap "$GITHUB_WORKSPACE"
          brew trust thedavidweng/unsigned-tap
          brew install --cask thedavidweng/unsigned-tap/obs-advanced-scene-switcher
          test -f '/Library/Application Support/obs-studio/plugins/advanced-scene-switcher.plugin/Contents/MacOS/advanced-scene-switcher'
      - name: Verify OBS loads plugin
        run: |
          set -euo pipefail
          open -n /Applications/OBS.app --args --disable-shutdown-check --multi
          log_dir="$HOME/Library/Application Support/obs-studio/logs"
          for ((attempt = 0; attempt < 90; attempt++)); do
            if grep -hE '\[adv-ss\] version: 1\.37\.2' "$log_dir"/*.txt 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          find "$log_dir" -name '*.txt' -exec cat {} + || true
          echo 'OBS did not report initializing the plugin' >&2
          exit 1
      - name: Online audit and uninstall
        run: |
          brew audit --cask --online thedavidweng/unsigned-tap/obs-advanced-scene-switcher
          brew uninstall --cask thedavidweng/unsigned-tap/obs-advanced-scene-switcher
          test ! -e '/Library/Application Support/obs-studio/plugins/advanced-scene-switcher.plugin'

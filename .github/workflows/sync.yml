name: Health status smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check real curl responses
        run: |
          python3 - <<'PY'
          import http.server
          import sys
          import threading

          sys.path.insert(0, "scripts")
          from check_cask_health import check_url_and_fetch

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_HEAD(self):
                  self.send_response(403)
                  self.end_headers()

              def do_GET(self):
                  self.send_response(403)
                  self.send_header("Content-Length", "2048")
                  self.end_headers()
                  try:
                      self.wfile.write(b"x" * 2048)
                  except BrokenPipeError:
                      pass

              def log_message(self, format, *args):
                  pass

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              result = check_url_and_fetch("fixture", f"http://127.0.0.1:{server.server_port}/")
              print("Local HTTP fixture:", result)
              assert result[2] is None and "GET: HTTP 403:" in result[3]
          finally:
              server.shutdown()
              thread.join()
              server.server_close()

          result = check_url_and_fetch(
              "pokemon-reborn",
              "https://www.rebornevo.com/downloads/rebornremote/Reborn_19.5/Reborn-19.5.0-macos.zip",
          )
          print("Live endpoint:", result)
          if result[2] is None and "Maximum file size exceeded" in result[3]:
              assert "GET: HTTP 403:" in result[3]
          PY

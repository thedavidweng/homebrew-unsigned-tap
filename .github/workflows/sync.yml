name: Ueli upgrade check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
      - name: Trust tap
        run: |
          brew tap --custom-remote thedavidweng/unsigned-tap "$GITHUB_WORKSPACE"
          brew trust thedavidweng/unsigned-tap
      - name: Install previous version and upgrade
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Applications"
          git switch --detach 13cfee61132bf3065501a20fa9c90bcee40094f7
          brew install --cask thedavidweng/unsigned-tap/ueli --appdir="$RUNNER_TEMP/Applications"
          app="$RUNNER_TEMP/Applications/ueli.app"
          test "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = 9.29.0
          git switch --detach b577f1845cd1fc57138dd02432a1baa02bf92c10
          brew livecheck --cask --json thedavidweng/unsigned-tap/ueli |
            jq -e 'length == 1 and .[0].version.current == "9.29.1" and .[0].version.latest == "9.29.1"'
          brew upgrade --cask thedavidweng/unsigned-tap/ueli --appdir="$RUNNER_TEMP/Applications"
          test "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = 9.29.1
          open -n "$app"
          for ((attempt = 0; attempt < 30; attempt++)); do
            if pid="$(pgrep -f "$app/Contents/MacOS/Ueli" | head -n 1)" && [[ -n "$pid" ]]; then
              sleep 5
              kill -0 "$pid"
              kill "$pid"
              brew uninstall --cask thedavidweng/unsigned-tap/ueli
              exit 0
            fi
            sleep 1
          done
          echo 'Ueli did not remain running' >&2
          exit 1
      - name: Online audit
        run: brew audit --cask --online thedavidweng/unsigned-tap/ueli

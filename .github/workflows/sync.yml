name: Catchup real Homebrew test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Temporary fixture PR number
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
      - name: Refresh isolated fixture
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_FROM_API: 1
          HOMEBREW_DEVELOPER: 1
          DEFAULT_BRANCH: test/catchup-real-brew-base
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          test "$(gh api user --jq .login)" = "$GITHUB_REPOSITORY_OWNER"
          brew tap --custom-remote thedavidweng/unsigned-tap "$GITHUB_WORKSPACE"
          brew trust thedavidweng/unsigned-tap
          gh auth setup-git
          tap="$(brew --repository thedavidweng/unsigned-tap)"
          git -C "$tap" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$tap" fetch origin "$DEFAULT_BRANCH"
          git -C "$tap" checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          git -C "$tap" config user.name "$(git -C "$tap" show -s --format=%an HEAD)"
          git -C "$tap" config user.email "$(git -C "$tap" show -s --format=%ae HEAD)"
          mkdir -p "$RUNNER_TEMP/catchup-test"
          cd "$RUNNER_TEMP/catchup-test"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base="$DEFAULT_BRANCH" --paginate --slurp |
            jq --argjson n "$PR_NUMBER" 'add | map(select(.number == $n))' > open-cask-prs.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg owner "$GITHUB_REPOSITORY_OWNER" \
            'length == 1 and .[0].draft and .[0].head.ref == "bump-treesheets-2.23.0-e2e"
             and .[0].head.repo.full_name == $repo and .[0].user.login == $owner' \
            open-cask-prs.json >/dev/null
          python3 "$GITHUB_WORKSPACE/scripts/autobump.py" bump treesheets catchup --version=2.23.1
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/Casks/treesheets.rb?ref=${head_sha}" --jq .content |
            base64 -D | grep -q 'version "2.23.1"'

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:
    inputs:
      casks:
        description: List of casks to audit (comma-separated)
        required: true
      skip_install:
        description: Skip install
        required: false
        default: true
        type: boolean

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-matrix:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust tap
        run: brew trust thedavidweng/unsigned-tap
      - name: Test cask maintenance scripts
        run: python3 -m unittest discover -s tests -v
      - name: Check platform compatibility
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump-') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check_cask_compatibility.py "$BASE_SHA" "$HEAD_SHA"
          printf 'Cask compatibility base: %s\n' "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate matrix
        id: generate-matrix
        env:
          INPUT_CASKS: ${{ github.event.inputs.casks }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            read -r -a CASK_ARGS <<< "${INPUT_CASKS//,/ }"
            brew generate-cask-ci-matrix ${{ github.event.inputs.skip_install && '--skip-install' }} --casks "${CASK_ARGS[@]}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            brew generate-cask-ci-matrix --syntax-only
          else
            brew generate-cask-ci-matrix --url "$PR_URL"
          fi

  test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 60
    name: ${{ matrix.name }}
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: true
          cask: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust tap
        run: brew trust thedavidweng/unsigned-tap
      - name: Run brew test-bot --only-tap-syntax
        if: always() && !matrix.cask
        run: brew test-bot --tap '${{ matrix.tap }}' --only-tap-syntax
      - name: Run brew audit --cask
        if: always() && matrix.cask
        run: brew audit --cask ${{ matrix.cask.token || matrix.tap }}
      - name: Run brew style
        if: always() && matrix.cask
        run: brew style Casks/${{ matrix.cask.token }}.rb

  conclusion:
    timeout-minutes: 10
    needs: test
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (always()) }}
    steps:
      - run: ${{ needs.test.result == 'success' }}

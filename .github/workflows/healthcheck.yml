name: Cask Healthcheck

on:
  schedule:
    - cron: "0 4 * * 0" # Weekly on Sunday at 04:00 UTC
  workflow_dispatch:
    inputs:
      auto_delete:
        description: "Automatically remove dead casks and open PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  healthcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: true
      - name: Tap self
        run: brew tap --custom-remote thedavidweng/unsigned-tap "${GITHUB_WORKSPACE}"
      - name: Check download availability
        id: check
        run: |
          if [[ "${{ inputs.auto_delete }}" == "true" ]]; then
            python3 scripts/check_cask_health.py --delete || true
          else
            python3 scripts/check_cask_health.py
          fi
      - name: Create PR for deleted dead casks
        if: inputs.auto_delete && always()
        run: |
          if git diff --quiet Casks/; then
            echo "No dead casks to remove."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="cleanup/dead-casks-$(date +%Y%m%d)"
          git checkout -B "$branch"
          git add Casks/ scripts/
          git commit -m "chore(casks): remove uninstallable dead casks"
          git push --force-with-lease origin "$branch"
          gh pr create --title "chore: remove uninstallable dead casks $(date +%Y-%m-%d)" \
                       --body "Automated cleanup: identified casks whose upstream downloads or repos no longer exist (HTTP 404 / expired SSL)." \
                       --base main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

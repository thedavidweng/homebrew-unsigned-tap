name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main
      - name: Tap self
        run: brew tap --custom-remote thedavidweng/unsigned-tap "${GITHUB_WORKSPACE}"
      - name: Audit all casks (offline)
        run: |
          for cask in Casks/*.rb; do
            token=$(basename "$cask" .rb)
            echo "Auditing ${token} ..."
            brew audit --cask --strict "thedavidweng/unsigned-tap/${token}" || exit 1
          done
      - name: Style
        run: brew style thedavidweng/unsigned-tap

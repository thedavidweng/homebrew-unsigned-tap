name: audit

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
      - name: Tap self
        run: brew tap --custom-remote thedavidweng/unsigned-tap "${GITHUB_WORKSPACE}"
      - name: Audit all casks (offline)
        run: |
          casks=()
          for cask in Casks/*.rb; do
            token=$(basename "$cask" .rb)
            casks+=("thedavidweng/unsigned-tap/${token}")
          done
          brew audit --cask --strict "${casks[@]}"
      - name: Style
        run: brew style thedavidweng/unsigned-tap

name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Tap self
        run: brew tap --custom-remote --force-auto-update thedavidweng/unsigned-tap $GITHUB_WORKSPACE
      - name: Audit all casks (offline)
        run: |
          for cask in Casks/*.rb; do
            token=$(basename "$cask" .rb)
            echo "Auditing $token ..."
            brew audit --cask --strict thedavidweng/unsigned-tap/$token || exit 1
          done
      - name: Style
        run: brew style Casks/*.rb

name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c722b5d961eb7f3ebec81ec2e5584faf7c3cff5d # main
      - name: Tap self
        run: brew tap --custom-remote thedavidweng/unsigned-tap "${GITHUB_WORKSPACE}"
      - name: Audit all casks (offline)
        run: |
          for cask in Casks/*.rb; do
            token=$(basename "$cask" .rb)
            echo "Auditing ${token} ..."
            brew audit --cask --strict "thedavidweng/unsigned-tap/${token}" || exit 1
          done
      - name: Style
        run: brew style thedavidweng/unsigned-tap

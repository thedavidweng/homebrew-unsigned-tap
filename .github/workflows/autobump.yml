name: Autobump

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Space-separated cask tokens from this tap to bump
        required: false
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  autobump:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 60
    env:
      HOMEBREW_DEVELOPER: 1
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: true
          cask: true
      - uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          username: BrewTestBot
      - name: Check PAT identity
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
        run: |
          # Fail fast with a clear message if the PAT expired or was revoked;
          # without it every push/PR would silently fall back to gated runs.
          login="$(gh api user --jq .login)"
          echo "Autobump pushes and PRs will run as @${login}"
          test "$login" = "${{ github.repository_owner }}"
      - name: Trust tap
        run: brew trust thedavidweng/unsigned-tap
      - name: Fetch upstream version snapshot
        env:
          GH_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
        run: |
          # The daily sync owns the single upstream clone; consume its
          # snapshot instead of cloning homebrew-cask eight times a day.
          # A missing snapshot only disables catch-up rows for this run,
          # never the livecheck bumps. Uses only long-stable gh api calls:
          # the preinstalled runner gh predates several gh run list flags.
          mkdir -p /tmp/upstream-snapshot
          aid="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=upstream-versions&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)] | .[0].id // empty')"
          if [[ -n "$aid" ]] && gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              > /tmp/upstream-snapshot.zip \
            && unzip -o -q /tmp/upstream-snapshot.zip -d /tmp/upstream-snapshot; then
            echo "Upstream snapshot from artifact $aid"
          else
            echo "::warning::no upstream snapshot available; catch-up disabled this run"
          fi
      - name: Bump casks
        env:
          # PAT, not GITHUB_TOKEN: pushes authenticated as the token owner let
          # the resulting pull_request workflows run to completion. Pushes made
          # with GITHUB_TOKEN leave those runs gated at action_required, so no
          # status ever reports back to the PR and nothing can auto-merge it.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
          CASKS: ${{ inputs.casks }}
          GH_TOKEN: ${{ secrets.AUTOBUMP_PAT }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          CASK_ARGS=()
          if [[ -n "${CASKS-}" ]]; then
            # Qualify every requested cask so Homebrew never selects the official tap.
            # shellcheck disable=SC2086
            for cask in ${CASKS}; do
              CASK_ARGS+=("thedavidweng/unsigned-tap/${cask}")
            done
          else
            CASK_ARGS+=(--tap=thedavidweng/unsigned-tap)
          fi
          echo "==> Checking for outdated casks via livecheck ..."
          for architecture in arm intel; do
            brew ruby -e 'require "dev-cmd/livecheck"; require "simulate_system"; Homebrew::SimulateSystem.with(arch: ARGV.shift.to_sym) { Homebrew::DevCmd::LivecheckCmd.new(ARGV).run }' \
              -- "${architecture}" "${CASK_ARGS[@]}" --newer-only --extract-plist --json > "outdated-casks-${architecture}.json"
          done
          OUTDATED=$(python3 "$GITHUB_WORKSPACE/scripts/autobump.py" plan)
          echo "Livecheck outdated: ${OUTDATED:-<none>}"
          gh auth setup-git
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base="${DEFAULT_BRANCH}" --paginate --slurp | jq add > open-cask-prs.json
          # Catch casks livecheck cannot see: single-version tokens where the
          # upstream checkout is strictly newer (skips and open PRs excluded).
          # bump-cask-pr still validates each one via download + audit.
          CATCHUP=$(SNAPSHOT_JSON=/tmp/upstream-snapshot/upstream-versions.json \
            TAP_CASK_DIR="$(brew --repository thedavidweng/unsigned-tap)/Casks" \
            EXCLUDE_TOKENS="$(awk -F'\t' '{print $1}' <<<"${OUTDATED}" | tr '\n' ' ')" \
            ONLY_TOKENS="${CASKS-}" \
            OPEN_PRS_JSON=open-cask-prs.json \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            python3 "$GITHUB_WORKSPACE/scripts/upstream_catchup.py")
          echo "Upstream catch-up: ${CATCHUP:-<none>}"
          COMBINED=$(printf '%s\n%s' "${OUTDATED}" "${CATCHUP}" | { grep -v '^$' || true; } | awk -F'\t' '!seen[$1]++')
          FAILED_COUNT=0
          FAILED_LIST=""
          : > bump-failures.txt
          if [[ -z "${COMBINED// /}" ]]; then
            echo "No outdated casks found."
          else
            echo "Outdated: ${COMBINED}"
            while IFS=$'\t' read -r cask _version version_args source; do
              read -r -a BUMP_ARGS <<< "${version_args}"
              # One broken cask must not block the remaining bumps.
              if ! python3 "$GITHUB_WORKSPACE/scripts/autobump.py" bump "$cask" "${source:-livecheck}" "${BUMP_ARGS[@]}"; then
                echo "::warning::bump failed for ${cask}; skipping this run"
                printf '%s\n' "$cask" >> bump-failures.txt
                FAILED_COUNT=$((FAILED_COUNT + 1))
                FAILED_LIST="${FAILED_LIST:+$FAILED_LIST }$cask"
              fi
            done <<< "${COMBINED}"
          fi
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "::warning::${FAILED_COUNT} cask(s) failed to bump: ${FAILED_LIST}"
          fi

      - name: Retain livecheck evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livecheck-casks
          path: |
            outdated-casks.json
            bump-failures.txt
          if-no-files-found: error
          retention-days: 7

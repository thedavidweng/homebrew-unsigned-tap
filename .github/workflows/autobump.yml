name: Autobump

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Space-separated cask tokens from this tap to bump
        required: false
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  autobump:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 60
    env:
      HOMEBREW_DEVELOPER: 1
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          core: true
          cask: true
      - uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          username: BrewTestBot
      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CASKS: ${{ inputs.casks }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          CASK_ARGS=()
          if [[ -n "${CASKS-}" ]]; then
            # Qualify every requested cask so Homebrew never selects the official tap.
            # shellcheck disable=SC2086
            for cask in ${CASKS}; do
              CASK_ARGS+=("thedavidweng/unsigned-tap/${cask}")
            done
          else
            CASK_ARGS+=(--tap=thedavidweng/unsigned-tap)
          fi
          echo "==> Checking for outdated casks via livecheck ..."
          for architecture in arm intel; do
            brew ruby -e 'require "dev-cmd/livecheck"; require "simulate_system"; Homebrew::SimulateSystem.with(arch: ARGV.shift.to_sym) { Homebrew::DevCmd::LivecheckCmd.new(ARGV).run }' \
              -- "${architecture}" "${CASK_ARGS[@]}" --newer-only --extract-plist --json > "outdated-casks-${architecture}.json"
          done
          OUTDATED=$(python3 -c '
          import json,sys
          data={arch:json.load(open("outdated-casks-"+arch+".json")) for arch in ("arm","intel")}
          with open("outdated-casks.json","w") as evidence:
              json.dump(data,evidence,indent=2)
          versions={}
          for arch,results in data.items():
              for d in results:
                  if d.get("status") == "error":
                      sys.exit(json.dumps(d))
                  if "version" in d and d["version"]["outdated"]:
                      versions.setdefault(d["cask"],{})[arch]=d["version"]["latest"]
          for cask,latest in sorted(versions.items()):
              if len(latest)==2 and latest["arm"]==latest["intel"]:
                  version_args=["--version="+latest["arm"]]
                  branch_version=latest["arm"]
              else:
                  version_args=["--version-"+arch+"="+version for arch,version in latest.items()]
                  branch_version=latest["arm"] if "arm" in latest else latest["intel"]
                  if len(latest)==1:
                      branch_version+="-"+next(iter(latest))+"-only"
              print(cask+"\t"+branch_version+"\t"+" ".join(version_args))
          ')
          if [[ -z "${OUTDATED// /}" ]]; then
            echo "No outdated casks found."
            exit 0
          fi
          echo "Outdated: ${OUTDATED}"
          while IFS=$'\t' read -r cask version version_args; do
            BUMP_BRANCH="bump-${cask}-${version//[,:]/-}"
            EXISTING_PR=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f base="${DEFAULT_BRANCH}" \
              -f head="${GITHUB_REPOSITORY_OWNER}:${BUMP_BRANCH}" \
              | jq -r --arg repo "$GITHUB_REPOSITORY" \
                '.[] | select(.head.repo.full_name == $repo) | .html_url')
            if [[ -n "$EXISTING_PR" ]]; then
              echo "Already pending ${cask} ${version}: ${EXISTING_PR}"
              continue
            fi
            echo "==> Bumping ${cask} to ${version} ..."
            read -r -a BUMP_ARGS <<< "${version_args}"
            brew bump-cask-pr --no-fork "${BUMP_ARGS[@]}" "thedavidweng/unsigned-tap/${cask}"
          done <<< "${OUTDATED}"

      - name: Retain livecheck evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livecheck-casks
          path: outdated-casks.json
          if-no-files-found: error
          retention-days: 7

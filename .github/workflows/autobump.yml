name: Autobump

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Space-separated cask tokens from this tap to bump
        required: false
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  autobump:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    timeout-minutes: 60
    env:
      HOMEBREW_DEVELOPER: 1
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          core: true
          cask: true
      - uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          username: BrewTestBot
      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CASKS: ${{ inputs.casks }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          CASK_ARGS=()
          if [[ -n "${CASKS-}" ]]; then
            # Qualify every requested cask so Homebrew never selects the official tap.
            # shellcheck disable=SC2086
            for cask in ${CASKS}; do
              CASK_ARGS+=("thedavidweng/unsigned-tap/${cask}")
            done
          else
            CASK_ARGS+=(--tap=thedavidweng/unsigned-tap)
          fi
          echo "==> Checking for outdated casks via livecheck ..."
          for architecture in arm intel; do
            brew ruby -e 'require "dev-cmd/livecheck"; require "simulate_system"; Homebrew::SimulateSystem.with(arch: ARGV.shift.to_sym) { Homebrew::DevCmd::LivecheckCmd.new(ARGV).run }' \
              -- "${architecture}" "${CASK_ARGS[@]}" --newer-only --extract-plist --json > "outdated-casks-${architecture}.json"
          done
          OUTDATED=$(python3 "$GITHUB_WORKSPACE/scripts/autobump.py" plan)
          if [[ -z "${OUTDATED// /}" ]]; then
            echo "No outdated casks found."
            exit 0
          fi
          echo "Outdated: ${OUTDATED}"
          gh auth setup-git
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base="${DEFAULT_BRANCH}" --paginate --slurp | jq add > open-cask-prs.json
          while IFS=$'\t' read -r cask version version_args; do
            read -r -a BUMP_ARGS <<< "${version_args}"
            python3 "$GITHUB_WORKSPACE/scripts/autobump.py" bump "$cask" "$version" "${BUMP_ARGS[@]}"
          done <<< "${OUTDATED}"

      - name: Retain livecheck evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livecheck-casks
          path: outdated-casks.json
          if-no-files-found: error
          retention-days: 7

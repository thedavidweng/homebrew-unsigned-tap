name: Autobump

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to bump
        required: false
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  autobump:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 60
    env:
      HOMEBREW_DEVELOPER: 1
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main
        with:
          core: true
          cask: true
      - uses: Homebrew/actions/git-user-config@fccef3b26268fc4a788fd7ad7c189f3a105cbf13 # main
        with:
          username: BrewTestBot
      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CASKS: ${{ inputs.casks }}
        run: |
          # NOTE: `brew bump --auto` only works for official taps
          # (it looks for the autobump list). For third-party taps it always
          # exits 1 with "No autobumped casks found", failing the check.
          # Use livecheck + bump-cask-pr instead, and never fail the check
          # when there is simply nothing to bump.
          if [[ -n "${CASKS-}" ]]; then
            # Explicit list (e.g. manual dispatch): bump each; failures stop the job.
            # Word splitting on the list is intentional.
            # shellcheck disable=SC2086
            for cask in ${CASKS}; do
              echo "==> Bumping ${cask} ..."
              brew bump-cask-pr --no-fork "${cask}"
            done
            exit 0
          fi
          echo "==> Checking for outdated casks via livecheck ..."
          OUTDATED_JSON=$(brew livecheck --tap=thedavidweng/unsigned-tap --newer-only --extract-plist --json)
          OUTDATED=$(echo "${OUTDATED_JSON}" | python3 -c "import json,sys; data=json.load(sys.stdin); print(' '.join(d['cask'] for d in data if d.get('version',{}).get('latest') and d['version']['latest'] != d['version'].get('current')))")
          if [[ -z "${OUTDATED// /}" ]]; then
            echo "No outdated casks found."
            exit 0
          fi
          echo "Outdated: ${OUTDATED}"
          # Word splitting on the list is intentional.
          # shellcheck disable=SC2086
          for cask in ${OUTDATED}; do
            echo "==> Bumping ${cask} ..."
            brew bump-cask-pr --no-fork "${cask}"
          done

name: Autobump

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Space-separated cask tokens from this tap to bump
        required: false
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  autobump:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 60
    env:
      HOMEBREW_DEVELOPER: 1
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          core: true
          cask: true
      - uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          username: BrewTestBot
      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CASKS: ${{ inputs.casks }}
        run: |
          set -euo pipefail
          CASK_ARGS=()
          if [[ -n "${CASKS-}" ]]; then
            # Qualify every requested cask so Homebrew never selects the official tap.
            # shellcheck disable=SC2086
            for cask in ${CASKS}; do
              CASK_ARGS+=("thedavidweng/unsigned-tap/${cask}")
            done
          else
            CASK_ARGS+=(--tap=thedavidweng/unsigned-tap)
          fi
          echo "==> Checking for outdated casks via livecheck ..."
          brew livecheck "${CASK_ARGS[@]}" --newer-only --extract-plist --debug --json > outdated-casks.json
          OUTDATED=$(python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for d in data:
              if d.get("status") == "error":
                  sys.exit(json.dumps(d))
          print("\n".join(d["cask"]+"\t"+d["version"]["latest"] for d in data if "version" in d and d["version"]["outdated"]))
          ' < outdated-casks.json)
          if [[ -z "${OUTDATED// /}" ]]; then
            echo "No outdated casks found."
            exit 0
          fi
          echo "Outdated: ${OUTDATED}"
          while IFS=$'\t' read -r cask version; do
            echo "==> Bumping ${cask} to ${version} ..."
            brew bump-cask-pr --no-fork --version="${version}" "thedavidweng/unsigned-tap/${cask}"
          done <<< "${OUTDATED}"

      - name: Retain livecheck evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livecheck-casks
          path: outdated-casks.json
          if-no-files-found: error
          retention-days: 7

name: Autobump

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to bump
        required: false
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

jobs:
  autobump:
    env:
      HOMEBREW_DEVELOPER: 1
    runs-on: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
        with:
          core: true
          cask: true
      - uses: Homebrew/actions/git-user-config@main
        with:
          username: BrewTestBot
      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CASKS: ${{ inputs.casks }}
        run: |
          # NOTE: `brew bump --auto` only works for official taps
          # (it looks for the autobump list). For third-party taps it always
          # exits 1 with "No autobumped casks found", failing the check.
          # Use livecheck + bump-cask-pr instead, and never fail the check
          # when there is simply nothing to bump.
          if [[ -n "${CASKS-}" ]]; then
            # Explicit list (e.g. manual dispatch): bump each, continue on error.
            for cask in ${CASKS}; do
              echo "==> Bumping ${cask} ..."
              brew bump-cask-pr --no-fork "${cask}" || echo "::warning::bump failed for ${cask}"
            done
            exit 0
          fi
          echo "==> Checking for outdated casks via livecheck ..."
          OUTDATED_JSON=$(brew livecheck --tap=thedavidweng/unsigned-tap --newer-only --json 2>/dev/null || echo "[]")
          OUTDATED=$(echo "${OUTDATED_JSON}" | python3 -c "import json,sys; data=json.load(sys.stdin); print(' '.join(d.get('token','') for d in data if d.get('version',{}).get('latest') and d['version']['latest'] != d['version'].get('current')))" || true)
          if [[ -z "${OUTDATED// /}" ]]; then
            echo "No outdated casks found."
            exit 0
          fi
          echo "Outdated: ${OUTDATED}"
          for cask in ${OUTDATED}; do
            echo "==> Bumping ${cask} ..."
            brew bump-cask-pr --no-fork "${cask}" || echo "::warning::bump failed for ${cask}"
          done
